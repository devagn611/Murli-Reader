      <h1>Read Avyakt Murlis</h1>
      <p>
        Avyakt Murli Reader is a web reader for Hindi Avyakt Murlis. It is dedicated to Brahma
        Kumaris students who want an easy way to read Avyakt Vaani from 1969 to 2017.
      </p>
      <h2>Frequently asked questions</h2>
      <dl>
        <dt>What is Avyakt Murli Reader?</dt>
        <dd>
          Avyakt Murli Reader is a web reader for Hindi Avyakt Murlis. It is dedicated to Brahma
          Kumaris students who want an easy way to read Avyakt Vaani.
        </dd>
        <dt>Who is Avyakt Murli Reader for?</dt>
        <dd>
          It is for students of Brahma Kumaris. The site was created by Devagn Maniya, a kumar of BK
          Gariyadhar.
        </dd>
        <dt>Which years of Avyakt Murlis are included?</dt>
        <dd>The reader includes 49 Hindi Avyakt Vaani volumes covering 1969 to 2017.</dd>
        <dt>What language are the murlis in?</dt>
        <dd>The murli text is in Hindi. The reader interface is in English.</dd>
        <dt>How do I turn pages?</dt>
        <dd>Swipe left or right on the page, or use the arrow buttons on the sides of the reader.</dd>
        <dt>Can I make the text larger?</dt>
        <dd>
          Yes. Use the Toggle font size button above the reader to switch between regular and larger
          text.
        </dd>
        <dt>How do I contact the creator?</dt>
        <dd>
          Email Devagn Maniya at devagnmaniya611@gmail.com, or open the About page on Avyakt Murli
          Reader.
        </dd>
      </dl>
